[package]
name = "inviteflow-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde", "clock"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
