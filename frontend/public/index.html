<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Một lời mời</title>
<meta name="description" content="Một lời mời đi chơi, gửi riêng cho một người.">
<meta property="og:title" content="Một lời mời">
<meta property="og:description" content="Một lời mời đi chơi, gửi riêng cho một người.">
<meta property="og:image" content="https://motloimoi.cc.cd/og-image.svg">
<link rel="canonical" href="https://motloimoi.cc.cd/">
<link rel="stylesheet" href="assets/css/style.css">
<script>window.API_BASE = window.API_BASE || 'https://minneapolis-exhibits-hip-relates.trycloudflare.com';</script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="brand">Inviteflow</span>
    <span class="meta">Một lời mời riêng</span>
  </header>

  <main class="panel" style="margin-top:48px">
    <div class="split">
      <div>
        <p class="eyebrow">Một lời mời</p>
        <h1>Làm người yêu anh nhé?</h1>
        <svg class="signature" viewBox="0 0 120 8" aria-hidden="true"><path d="M2 6c20-3 48-4 116-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <p class="lead">Mình cùng nhau đi chơi nha. Một buổi chiều, một ly nước, và một câu hỏi.</p>
        <div class="actions">
          <button type="button" class="btn btn-primary" id="yes">Vâng</button>
          <button type="button" class="btn" id="no">Không Nha</button>
        </div>
        <p class="status" id="status"></p>
      </div>
      <img id="catImage" class="hero-img" src="https://i.pinimg.com/originals/47/42/9e/47429e058b9834c5d27d8faf0d96c2c6.gif" alt="Mèo con">
    </div>
  </main>
</div>
<script type="module">
  import { save, go, setStatus } from './assets/js/app.js';
  import { postResponse } from './assets/js/api.js';

  const images = [
    'https://i.pinimg.com/originals/54/22/99/54229922820d7c505a7ab53d783b310b.gif',
    'https://i.pinimg.com/originals/44/06/b8/4406b868368695db27f93d9780e67f6b.gif',
    'https://i.pinimg.com/736x/a1/9c/1a/a19c1a969a8a82f5cde6a7848feaa807.jpg',
    'https://i.pinimg.com/736x/b8/d1/ae/b8d1ae6b9861b6e625b95e3b89bf9313.jpg'
  ];
  let step = 0;
  const img = document.getElementById('catImage');

  img.addEventListener('error', () => { img.hidden = true; });
  document.getElementById('yes').addEventListener('click', () => {
    save('consent', 'Vâng');
    go('thanks.html');
  });
  document.getElementById('no').addEventListener('click', () => {
    step += 1;
    img.src = images[(step - 1) % images.length];
    setStatus('status', 'Vẫn còn chỗ cho một câu trả lời khác.');
    if (step === 1) {
      save('consent', 'Không Nha');
      postResponse({ consent: 'Không Nha' }).catch(() => {});
    }
  });
</script>
</body>
</html>
