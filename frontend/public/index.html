<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Một lời mời</title>
<meta name="description" content="Một lời mời đi chơi, gửi riêng cho một người.">
<meta property="og:title" content="Một lời mời">
<meta property="og:description" content="Một lời mời đi chơi, gửi riêng cho một người.">
<meta property="og:image" content="https://motloimoi.cc.cd/og-image.svg">
<link rel="canonical" href="https://motloimoi.cc.cd/">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="stylesheet" href="assets/css/style.css">
<script>window.API_BASE = window.API_BASE || 'https://inviteflow-api2.onrender.com';</script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="brand"><img src="assets/img/logo-micro.png" width="28" height="28" alt="">Inviteflow</span>
    <span class="meta">Một lời mời riêng</span>
  </header>

  <main class="panel" style="margin-top:48px">
    <div class="split">
      <div>
        <p class="eyebrow" id="homeEyebrow">Một lời mời</p>
        <h1 id="homeTitle">Làm người yêu anh nhé?</h1>
        <svg class="signature" viewBox="0 0 120 8" aria-hidden="true"><path d="M2 6c20-3 48-4 116-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <p class="lead" id="homeLead">Mình cùng nhau đi chơi nha. Một buổi chiều, một ly nước, và một câu hỏi.</p>
        <div class="actions">
          <button type="button" class="btn btn-primary" id="yes">Vâng</button>
          <button type="button" class="btn" id="no">Không Nha</button>
        </div>
        <p class="status" id="status"></p>
      </div>
      <div class="hero-stack">
        <img id="catImage" class="hero-img" src="/assets/img/content/47429e058b9834c5d27d8faf0d96c2c6.gif" alt="Mèo con">
        <img id="catImageNext" class="hero-img hero-img-overlay" alt="" aria-hidden="true">
      </div>
    </div>
  </main>
</div>
<script type="module">
  import { save, go, setStatus, loadContent } from './assets/js/app.js';
  import { postResponse } from './assets/js/api.js';

  let images = [
    '/assets/img/content/54229922820d7c505a7ab53d783b310b.gif',
    '/assets/img/content/4406b868368695db27f93d9780e67f6b.gif',
    '/assets/img/content/a19c1a969a8a82f5cde6a7848feaa807.jpg',
    '/assets/img/content/b8d1ae6b9861b6e625b95e3b89bf9313.jpg'
  ];
  const colors = ['#a8492f', '#3f6f52', '#6a4f8a', '#2f6b78'];
  const colorSets = [
    ['#a8492f', '#7a7168'],
    ['#3f6f52', '#a8492f'],
    ['#6a4f8a', '#8a6a20'],
    ['#2f6b78', '#a8492f']
  ];
  let words = ['Không Nha', 'Bấm đi mà', 'Đừng ngại', 'Thử lại nha', 'Bắt được không'];
  const panel = document.querySelector('.panel');
  const img = document.getElementById('catImage');
  const imgNext = document.getElementById('catImageNext');
  const no = document.getElementById('no');
  let step = 0;
  let resetTimer;
  let swapTimer;

  img.addEventListener('error', () => { img.hidden = true; });
  function crossfade(src) {
    if (!src || src === img.src) return;
    clearTimeout(swapTimer);
    imgNext.src = src;
    imgNext.classList.add('show');
    swapTimer = setTimeout(() => {
      img.src = src;
      imgNext.classList.remove('show');
    }, 180);
  }

  document.getElementById('yes').addEventListener('click', () => {
    save('consent', 'Vâng');
    go('thanks.html');
  });

  function dodge() {
    step += 1;
    crossfade(images[step % images.length]);
    panel.style.setProperty('--accent', colors[step % colors.length]);
    const pair = colorSets[step % colorSets.length];
    document.getElementById('yes').style.background = pair[0];
    no.style.background = pair[1];

    const area = panel.getBoundingClientRect();
    const button = no.getBoundingClientRect();
    const baseX = button.left - parseFloat(no.style.transform.match(/translate\(([-\d.]+)px/)?.[1] || 0);
    const minX = area.left + 24 - baseX;
    const maxX = area.right - 24 - button.width - baseX;
    const dx = minX < maxX ? minX + Math.random() * (maxX - minX) : 0;
    const dy = (Math.random() * 2 - 1) * 120;
    const rot = (Math.random() * 2 - 1) * 12;
    no.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(1.06)`;
    no.classList.add('dodging');
    setTimeout(() => no.classList.remove('dodging'), 260);

    no.textContent = words[step % words.length];
    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => { no.textContent = words[0]; }, 900);

    setStatus('status', 'Vẫn còn chỗ cho một câu trả lời khác.');
    if (step === 1) {
      save('consent', 'Không Nha');
      postResponse({ consent: 'Không Nha' }).catch(() => {});
    }
  }

  no.addEventListener('mouseenter', dodge);
  no.addEventListener('click', dodge);

  loadContent().then((content) => {
    const home = content.home || {};
    if (home.eyebrow) document.getElementById('homeEyebrow').textContent = home.eyebrow;
    if (home.title) document.getElementById('homeTitle').textContent = home.title;
    if (home.lead) document.getElementById('homeLead').textContent = home.lead;
    if (home.pageTitle) document.title = home.pageTitle;
    if (home.yes) document.getElementById('yes').textContent = home.yes;
    if (home.no) {
      words[0] = home.no;
      document.getElementById('no').textContent = home.no;
    }
    if (/^#[0-9a-f]{6}$/i.test(home.color || '')) {
      document.documentElement.style.setProperty('--accent', home.color);
    }
    if (Array.isArray(home.images) && home.images.length) images = home.images;
  });
</script>
</body>
</html>
