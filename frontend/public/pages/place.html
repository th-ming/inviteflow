<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="Một lời mời">
<meta property="og:description" content="Một lời mời đi chơi, gửi riêng cho một người.">
<meta property="og:image" content="https://motloimoi.indevs.in/og-image.svg">
<link rel="canonical" href="https://motloimoi.indevs.in/pages/place.html">
<title>Chọn nơi đi chơi</title>
<meta name="description" content="Chọn nơi đi chơi cho buổi hẹn.">
<link rel="stylesheet" href="../assets/css/style.css">
<script>window.API_BASE = window.API_BASE || 'https://inviteflow-api2.onrender.com';</script>
</head>
<body>
<main class="note">
  <p class="eyebrow">Bước 4 trên 4</p>
  <h1>Xong em muốn đi chơi đâu nữa nà?</h1>
  <svg class="signature" viewBox="0 0 132 10" aria-hidden="true"><path d="M2 7c22-4 55-6 128-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  <div class="choice-grid" id="choices"></div>
  <p class="status" id="status"></p>
  <div class="actions" id="nextWrap" hidden><button type="button" class="btn btn-primary" id="next">Tiếp</button></div>
</main>
<script type="module">
  import { renderChoices, reveal, setStatus, go } from '../assets/js/app.js';

  const special = 'Nơi Có Chúng Ta';
  renderChoices(['Công Viên', 'Rạp Phim', 'Quán Cafe', 'Nhà Ma', 'Dạo Quanh VNUA', special], 'choices', 'place', (label) => {
    setStatus('status', label === special
      ? 'Đi đâu miễn đi cùng em là được'
      : `Một buổi đi chơi ${label} thật tuyệt vời nhé`);
    reveal('nextWrap');
  });
  document.getElementById('next').addEventListener('click', () => go('done.html'));
</script>
</body>
</html>
