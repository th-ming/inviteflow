<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="Một lời mời">
<meta property="og:description" content="Một lời mời đi chơi, gửi riêng cho một người.">
<meta property="og:image" content="https://motloimoi.indevs.in/og-image.svg">
<link rel="canonical" href="https://motloimoi.indevs.in/pages/date.html">
<title>Chọn ngày hẹn</title>
<meta name="description" content="Chọn một ngày để cả hai cùng rảnh.">
<link rel="stylesheet" href="../assets/css/style.css">
<script>window.API_BASE = window.API_BASE || 'https://inviteflow-api2.onrender.com';</script>
</head>
<body>
<main class="note">
  <p class="eyebrow">Bước 1 trên 4</p>
  <h1>Em rảnh vào hàm nè</h1>
  <svg class="signature" viewBox="0 0 132 10" aria-hidden="true"><path d="M2 7c22-4 55-6 128-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  <p class="muted">Ngày nào: chọn một ngày nha</p>
  <label class="muted" for="datepicker">Ngày rảnh</label>
  <input class="field" type="date" id="datepicker" style="margin:8px 0 20px">
  <div class="actions">
    <button type="button" class="btn btn-primary" id="pick">Chọn</button>
    <button type="button" class="btn" id="cancel">Hủy</button>
  </div>
  <p class="status" id="status"></p>
  <div class="actions" id="nextWrap" hidden><button type="button" class="btn btn-primary" id="next">Tiếp</button></div>
</main>
<script type="module">
  import { save, go, formatDay, reveal, setStatus } from '../assets/js/app.js';

  const input = document.getElementById('datepicker');
  const wrap = document.getElementById('nextWrap');

  document.getElementById('pick').addEventListener('click', () => {
    if (!input.value) {
      setStatus('status', 'Vui lòng chọn ngày');
      wrap.hidden = true;
      return;
    }
    save('freeDay', input.value);
    setStatus('status', `Bạn chọn ngày: ${formatDay(input.value)}`);
    reveal('nextWrap');
  });

  document.getElementById('cancel').addEventListener('click', () => {
    input.value = '';
    setStatus('status', 'Đã hủy chọn ngày');
    wrap.hidden = true;
  });

  document.getElementById('next').addEventListener('click', () => go('food.html'));
</script>
</body>
</html>
