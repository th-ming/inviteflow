<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hẹn gặp bạn</title>
<meta name="description" content="Lời mời đã hoàn tất.">
<meta property="og:title" content="Một lời mời">
<meta property="og:image" content="https://motloimoi.cc.cd/og-image.svg">
<link rel="canonical" href="https://motloimoi.cc.cd/done.html">
<link rel="stylesheet" href="assets/css/style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script>window.API_BASE = window.API_BASE || 'https://minneapolis-exhibits-hip-relates.trycloudflare.com';</script>
</head>
<body>
<div class="app">
  <header class="topbar"><span class="brand">Inviteflow</span><span class="meta">Hoàn tất</span></header>
  <div class="layout">
    <nav class="rail" aria-label="Các bước">
      <div class="step done"><span class="num">01</span>Ngày</div>
      <div class="step done"><span class="num">02</span>Món</div>
      <div class="step done"><span class="num">03</span>Nước</div>
      <div class="step done"><span class="num">04</span>Nơi</div>
    </nav>
    <main class="stage">
      <section class="panel">
        <p class="eyebrow">Xong rồi</p>
        <h1>Hẹn gặp bạn</h1>
        <svg class="signature" viewBox="0 0 120 8" aria-hidden="true"><path d="M2 6c20-3 48-4 116-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <p class="lead">Đi đâu miễn đi cùng em là được</p>
        <div class="scene3d" id="scene3d" role="img" aria-label="Bông hoa nở trong vườn"></div>
        <div class="receipt">
          <div class="receipt-row"><span class="receipt-label">Ngày</span><span class="receipt-value" id="day">—</span></div>
          <div class="receipt-row"><span class="receipt-label">Món</span><span class="receipt-value" id="food">—</span></div>
          <div class="receipt-row"><span class="receipt-label">Nước</span><span class="receipt-value" id="drink">—</span></div>
          <div class="receipt-row"><span class="receipt-label">Nơi</span><span class="receipt-value" id="place">—</span></div>
        </div>
        <p class="status-line" id="statusLine"><span class="status-dot"></span><span id="statusText">Đang gửi lời trả lời</span></p>
      </section>
    </main>
  </div>
</div>
<script type="module">
  import { byId, read, formatDay } from './assets/js/app.js';
  import { postResponse } from './assets/js/api.js';

  byId('day').textContent = read('freeDay') ? formatDay(read('freeDay')) : 'Chưa chọn';
  byId('food').textContent = read('food') || 'Chưa chọn';
  byId('drink').textContent = read('drink') || 'Chưa chọn';
  byId('place').textContent = read('place') || 'Chưa chọn';

  if (read('consent') === 'Vâng' && !sessionStorage.getItem('inviteSubmitted')) {
    sessionStorage.setItem('inviteSubmitted', '1');
    postResponse({
      consent: 'Vâng', freeDay: read('freeDay'), food: read('food'),
      drink: read('drink'), place: read('place')
    }).then(() => {
      byId('statusLine').classList.add('done');
      byId('statusText').textContent = 'Đã ghi nhận lời trả lời';
    }).catch(() => {
      byId('statusText').textContent = 'Chưa ghi được, thử lại sau';
    });
  } else {
    byId('statusLine').classList.toggle('done', read('consent') === 'Vâng');
    byId('statusText').textContent = read('consent') === 'Vâng'
      ? 'Đã ghi nhận lời trả lời'
      : 'Chưa có lựa nào được ghi lại';
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
  import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
  import { hearts } from './assets/js/app.js';

  const host = document.getElementById('scene3d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(() => hearts(24), 300);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf7eae3);
  scene.fog = new THREE.Fog(0xf7eae3, 7, 15);

  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
  const viewFrom = new THREE.Vector3(0, 1.7, 6.4);
  const viewTo = new THREE.Vector3(0.55, 0.42, 3.9);
  const lookAt = new THREE.Vector3(-0.05, 0.02, 0);
  camera.position.copy(viewFrom);
  camera.lookAt(lookAt);

  const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  host.appendChild(renderer.domElement);

  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bokehPass = new BokehPass(scene, camera, { focus: 4.0, aperture: 0.00016, maxblur: 0.012 });
  composer.addPass(bokehPass);
  const bloomPass = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.1, 0.6, 0.94);
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  scene.add(new THREE.HemisphereLight(0xfff2e2, 0x8a7b6a, 1.35));
  const sun = new THREE.DirectionalLight(0xffd9b3, 3.2);
  sun.position.set(-3, 6, 4);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 20;
  sun.shadow.camera.left = -5;
  sun.shadow.camera.right = 5;
  sun.shadow.camera.top = 5;
  sun.shadow.camera.bottom = -5;
  sun.shadow.bias = -0.0005;
  scene.add(sun);
  const fill = new THREE.PointLight(0xffb27a, 6, 9, 2);
  fill.position.set(2.5, 1.5, 3);
  scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffc08a, 1.8);
  rim.position.set(1.5, 3, -4);
  scene.add(rim);

  function paperTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#eee2d3';
    ctx.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 4000; i += 1) {
      const x = Math.random() * 512;
      const y = Math.random() * 512;
      ctx.fillStyle = Math.random() > 0.5 ? 'rgba(120,90,65,0.06)' : 'rgba(255,255,255,0.12)';
      ctx.fillRect(x, y, 2, 2);
    }
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(3, 3);
    return texture;
  }

  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(4.5, 64),
    new THREE.MeshStandardMaterial({ map: paperTexture(), roughness: 0.95 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -1.36;
  ground.receiveShadow = true;
  scene.add(ground);

  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(1.2, 1.32, 0.16, 64),
    new THREE.MeshStandardMaterial({ color: 0xe6d8c8, roughness: 0.8 })
  );
  base.position.y = -1.26;
  base.castShadow = true;
  base.receiveShadow = true;
  scene.add(base);

  const flower = new THREE.Group();
  scene.add(flower);

  const stemMat = new THREE.MeshStandardMaterial({ color: 0x5b7c55, roughness: 0.75 });
  const stemCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, -1.18, 0),
    new THREE.Vector3(0.04, -0.6, 0.02),
    new THREE.Vector3(-0.03, 0.05, 0),
    new THREE.Vector3(0, 0.45, 0)
  ]);
  const stem = new THREE.Mesh(new THREE.TubeGeometry(stemCurve, 40, 0.045, 10, false), stemMat);
  stem.castShadow = true;
  flower.add(stem);

  const leafMat = new THREE.MeshStandardMaterial({ color: 0x75936c, roughness: 0.8, side: THREE.DoubleSide });
  const leafGeo = new THREE.SphereGeometry(0.3, 16, 10);
  const leafLeft = new THREE.Mesh(leafGeo, leafMat);
  leafLeft.scale.set(1.25, 0.16, 0.55);
  leafLeft.position.set(-0.34, -0.42, 0);
  leafLeft.rotation.z = 0.42;
  leafLeft.castShadow = true;
  flower.add(leafLeft);
  const leafRight = leafLeft.clone();
  leafRight.position.set(0.34, -0.05, 0.02);
  leafRight.rotation.z = -0.42;
  flower.add(leafRight);

  function petalGeometry() {
    const shape = new THREE.Shape();
    shape.moveTo(0, 0);
    shape.bezierCurveTo(0.28, 0.16, 0.36, 0.58, 0, 0.86);
    shape.bezierCurveTo(-0.36, 0.58, -0.28, 0.16, 0, 0);
    const geometry = new THREE.ShapeGeometry(shape, 24);
    const position = geometry.attributes.position;
    for (let i = 0; i < position.count; i += 1) {
      const y = position.getY(i);
      const curl = Math.sin((y / 0.86) * Math.PI) * 0.18;
      position.setZ(i, curl);
    }
    position.needsUpdate = true;
    const colors = new Float32Array(position.count * 3);
    const baseColor = new THREE.Color(0xc9785c);
    const tipColor = new THREE.Color(0xffd9c9);
    const mixed = new THREE.Color();
    for (let i = 0; i < position.count; i += 1) {
      const t = Math.min(1, position.getY(i) / 0.86);
      mixed.copy(baseColor).lerp(tipColor, t);
      colors[i * 3] = mixed.r;
      colors[i * 3 + 1] = mixed.g;
      colors[i * 3 + 2] = mixed.b;
    }
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geometry.computeVertexNormals();
    return geometry;
  }

  const petalGeo = petalGeometry();
  const petalMat = new THREE.MeshStandardMaterial({
    color: 0xffffff, vertexColors: true, roughness: 0.5, side: THREE.DoubleSide,
    emissive: 0xf3cfc2, emissiveIntensity: 0.12
  });
  const petalMatAlt = new THREE.MeshStandardMaterial({
    color: 0xffffff, vertexColors: true, roughness: 0.5, side: THREE.DoubleSide,
    emissive: 0xefc1ad, emissiveIntensity: 0.12
  });
  const petals = [];
  for (let i = 0; i < 8; i += 1) {
    const pivot = new THREE.Group();
    pivot.rotation.y = (i * Math.PI) / 4;
    const petal = new THREE.Mesh(petalGeo, i % 2 ? petalMat : petalMatAlt);
    petal.rotation.x = Math.PI / 2;
    petal.position.y = 0.45;
    petal.castShadow = true;
    pivot.add(petal);
    flower.add(pivot);
    petals.push(pivot);
  }

  const core = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.19, 2),
    new THREE.MeshStandardMaterial({ color: 0xc9893a, roughness: 0.45, emissive: 0x7a4a18, emissiveIntensity: 0.2 })
  );
  core.position.y = 0.45;
  core.castShadow = true;
  flower.add(core);

  const stamenMat = new THREE.MeshStandardMaterial({ color: 0xe0a94e, roughness: 0.5 });
  for (let i = 0; i < 14; i += 1) {
    const angle = (i / 14) * Math.PI * 2;
    const stamen = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.16, 6), stamenMat);
    stamen.position.set(Math.cos(angle) * 0.12, 0.55, Math.sin(angle) * 0.12);
    stamen.rotation.z = Math.cos(angle) * 0.5;
    stamen.rotation.x = Math.sin(angle) * 0.5;
    flower.add(stamen);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.022, 8, 6), stamenMat);
    tip.position.set(Math.cos(angle) * 0.17, 0.62, Math.sin(angle) * 0.17);
    flower.add(tip);
  }

  function heartTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(32, 54);
    ctx.bezierCurveTo(4, 36, 4, 16, 18, 14);
    ctx.bezierCurveTo(26, 13, 31, 18, 32, 22);
    ctx.bezierCurveTo(33, 18, 38, 13, 46, 14);
    ctx.bezierCurveTo(60, 16, 60, 36, 32, 54);
    ctx.fill();
    return new THREE.CanvasTexture(canvas);
  }

  const count = 60;
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i += 1) {
    positions[i * 3] = (Math.random() - 0.5) * 6;
    positions[i * 3 + 1] = Math.random() * 3 - 1;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 4;
  }
  const particleGeo = new THREE.BufferGeometry();
  particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const particles = new THREE.Points(
    particleGeo,
    new THREE.PointsMaterial({
      color: 0xb4593d, size: 0.13, map: heartTexture(),
      transparent: true, opacity: 0.7, depthWrite: false
    })
  );
  scene.add(particles);

  function glowTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    gradient.addColorStop(0, 'rgba(255,255,255,0.9)');
    gradient.addColorStop(0.4, 'rgba(255,220,180,0.35)');
    gradient.addColorStop(1, 'rgba(255,220,180,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(canvas);
  }

  const bokehPositions = new Float32Array(36 * 3);
  for (let i = 0; i < 36; i += 1) {
    bokehPositions[i * 3] = (Math.random() - 0.5) * 9;
    bokehPositions[i * 3 + 1] = Math.random() * 3 - 0.8;
    bokehPositions[i * 3 + 2] = -2 - Math.random() * 5;
  }
  const bokehGeo = new THREE.BufferGeometry();
  bokehGeo.setAttribute('position', new THREE.BufferAttribute(bokehPositions, 3));
  const bokeh = new THREE.Points(
    bokehGeo,
    new THREE.PointsMaterial({
      size: 0.7, map: glowTexture(), transparent: true, opacity: 0.5,
      depthWrite: false, color: 0xffd2a8
    })
  );
  scene.add(bokeh);

  const distantMat = new THREE.MeshStandardMaterial({ color: 0xd9b3a0, roughness: 0.9, side: THREE.DoubleSide });
  [[-2.6, -0.7, -2.4, 0.55], [2.4, -0.55, -3.1, 0.45], [-1.6, -0.85, -4.2, 0.4], [3.2, -0.6, -4.6, 0.5]].forEach(([x, y, z, scale]) => {
    const cluster = new THREE.Group();
    cluster.position.set(x, y, z);
    cluster.scale.setScalar(scale);
    for (let i = 0; i < 6; i += 1) {
      const pivot = new THREE.Group();
      pivot.rotation.y = (i * Math.PI) / 3;
      const petal = new THREE.Mesh(petalGeo, distantMat);
      petal.rotation.x = Math.PI / 2;
      petal.rotation.z = -0.5;
      petal.position.y = 0.5;
      pivot.add(petal);
      cluster.add(pivot);
    }
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), distantMat);
    dot.position.y = 0.5;
    cluster.add(dot);
    scene.add(cluster);
  });

  function resize() {
    const w = host.clientWidth;
    const h = host.clientHeight;
    if (!w || !h) return;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
    composer.setSize(w, h);
  }
  resize();
  window.addEventListener('resize', resize);

  const pointer = { x: 0, y: 0 };
  host.addEventListener('pointermove', (event) => {
    const rect = host.getBoundingClientRect();
    pointer.x = ((event.clientX - rect.left) / rect.width - 0.5) * 0.35;
    pointer.y = ((event.clientY - rect.top) / rect.height - 0.5) * 0.2;
  });
  host.addEventListener('pointerleave', () => { pointer.x = 0; pointer.y = 0; });

  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const start = performance.now();

  function pose(t) {
    petals.forEach((pivot, i) => {
      const k = Math.min(1, Math.max(0, (t - 0.25 - i * 0.08) / 1.5));
      pivot.rotation.x = -1.4 + 0.9 * easeOut(k);
    });
    const kc = Math.min(1, Math.max(0, (t - 0.7) / 1.1));
    core.scale.setScalar(0.45 + 0.55 * easeOut(kc));
    const kf = Math.min(1, t / 1.4);
    camera.position.lerpVectors(viewFrom, viewTo, easeInOut(kf));
    camera.position.x += pointer.x;
    camera.position.y += pointer.y;
    camera.lookAt(lookAt);
    particles.rotation.y = -t * 0.04;
  }

  if (reduce) {
    petals.forEach((pivot) => { pivot.rotation.x = -0.5; });
    core.scale.setScalar(1);
    camera.position.copy(viewTo);
    camera.lookAt(lookAt);
    composer.render();
  } else {
    function frame(now) {
      const t = (now - start) / 1000;
      pose(t);
      composer.render();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
</script>
</body>
</html>
