<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hẹn gặp bạn</title>
<meta name="description" content="Lời mời đã hoàn tất.">
<meta property="og:title" content="Một lời mời">
<meta property="og:image" content="https://motloimoi.cc.cd/og-image.svg">
<link rel="canonical" href="https://motloimoi.cc.cd/done.html">
<link rel="stylesheet" href="assets/css/style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}</script>
<script>window.API_BASE = window.API_BASE || 'https://minneapolis-exhibits-hip-relates.trycloudflare.com';</script>
</head>
<body>
<div class="app">
  <header class="topbar"><span class="brand">Inviteflow</span><span class="meta">Hoàn tất</span></header>
  <div class="layout">
    <nav class="rail" aria-label="Các bước">
      <div class="step done"><span class="num">01</span>Ngày</div>
      <div class="step done"><span class="num">02</span>Món</div>
      <div class="step done"><span class="num">03</span>Nước</div>
      <div class="step done"><span class="num">04</span>Nơi</div>
    </nav>
    <main class="stage">
      <section class="panel">
        <p class="eyebrow">Xong rồi</p>
        <h1>Hẹn gặp bạn</h1>
        <svg class="signature" viewBox="0 0 120 8" aria-hidden="true"><path d="M2 6c20-3 48-4 116-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <p class="lead">Đi đâu miễn đi cùng em là được</p>
        <div class="scene3d" id="scene3d" role="img" aria-label="Bông hoa nở"></div>
        <div class="receipt">
          <div class="receipt-row"><span class="receipt-label">Ngày</span><span class="receipt-value" id="day">—</span></div>
          <div class="receipt-row"><span class="receipt-label">Món</span><span class="receipt-value" id="food">—</span></div>
          <div class="receipt-row"><span class="receipt-label">Nước</span><span class="receipt-value" id="drink">—</span></div>
          <div class="receipt-row"><span class="receipt-label">Nơi</span><span class="receipt-value" id="place">—</span></div>
        </div>
        <p class="status-line" id="statusLine"><span class="status-dot"></span><span id="statusText">Đang gửi lời trả lời</span></p>
      </section>
    </main>
  </div>
</div>
<script type="module">
  import { byId, read, formatDay, hearts } from './assets/js/app.js';
  import { postResponse } from './assets/js/api.js';

  byId('day').textContent = read('freeDay') ? formatDay(read('freeDay')) : 'Chưa chọn';
  byId('food').textContent = read('food') || 'Chưa chọn';
  byId('drink').textContent = read('drink') || 'Chưa chọn';
  byId('place').textContent = read('place') || 'Chưa chọn';

  if (read('consent') === 'Vâng' && !sessionStorage.getItem('inviteSubmitted')) {
    sessionStorage.setItem('inviteSubmitted', '1');
    postResponse({
      consent: 'Vâng', freeDay: read('freeDay'), food: read('food'),
      drink: read('drink'), place: read('place')
    }).then(() => {
      byId('statusLine').classList.add('done');
      byId('statusText').textContent = 'Đã ghi nhận lời trả lời';
    }).catch(() => {
      byId('statusText').textContent = 'Chưa ghi được, thử lại sau';
    });
  } else {
    byId('statusLine').classList.toggle('done', read('consent') === 'Vâng');
    byId('statusText').textContent = read('consent') === 'Vâng'
      ? 'Đã ghi nhận lời trả lời'
      : 'Chưa có lựa nào được ghi lại';
  }

  if (read('consent') === 'Vâng') hearts(18);
</script>

<script type="module">
  import * as THREE from 'three';
  import { read, hearts } from './assets/js/app.js';

  setTimeout(() => hearts(20), 200);

  const host = document.getElementById('scene3d');
  if (!host) throw new Error('scene host missing');

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
  camera.position.set(0, 1.0, 4.8);
  camera.lookAt(0, 0.5, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  host.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  scene.add(new THREE.HemisphereLight(0xfff1e0, 0x7a7168, 1.8));
  const sun = new THREE.DirectionalLight(0xffd9b3, 2.6);
  sun.position.set(3, 5, 4);
  scene.add(sun);

  const flower = new THREE.Group();
  flower.scale.setScalar(1.1);
  flower.position.y = 0.15;
  scene.add(flower);

  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.035, 0.05, 1.4, 12),
    new THREE.MeshStandardMaterial({ color: 0x4f6b4f, roughness: 0.75 })
  );
  stem.position.y = -0.35;
  flower.add(stem);

  const leafGeo = new THREE.SphereGeometry(0.3, 12, 8);
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x6b8a63, roughness: 0.8 });
  const leafLeft = new THREE.Mesh(leafGeo, leafMat);
  leafLeft.scale.set(1, 0.22, 0.5);
  leafLeft.position.set(-0.28, -0.25, 0);
  leafLeft.rotation.z = 0.45;
  flower.add(leafLeft);
  const leafRight = leafLeft.clone();
  leafRight.position.x = 0.28;
  leafRight.rotation.z = -0.45;
  flower.add(leafRight);

  const petalMat = new THREE.MeshStandardMaterial({
    color: 0xffd9c9, roughness: 0.45, side: THREE.DoubleSide,
    emissive: 0xf3cfc2, emissiveIntensity: 0.3
  });
  const petalMatAlt = new THREE.MeshStandardMaterial({
    color: 0xf8c9b4, roughness: 0.45, side: THREE.DoubleSide,
    emissive: 0xefc1ad, emissiveIntensity: 0.3
  });
  const petalGeo = new THREE.SphereGeometry(0.5, 18, 12);
  const petals = [];
  for (let i = 0; i < 8; i += 1) {
    const pivot = new THREE.Group();
    pivot.rotation.y = (i * Math.PI) / 4;
    const petal = new THREE.Mesh(petalGeo, i % 2 ? petalMat : petalMatAlt);
    petal.scale.set(0.55, 0.13, 0.95);
    petal.position.set(0, 0.62, 0.48);
    pivot.add(petal);
    flower.add(pivot);
    petals.push(pivot);
  }

  const core = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.22, 1),
    new THREE.MeshStandardMaterial({ color: 0xc98a3a, roughness: 0.5 })
  );
  core.position.y = 0.62;
  flower.add(core);

  const positions = new Float32Array(48 * 3);
  for (let i = 0; i < 48; i += 1) {
    positions[i * 3] = (Math.random() - 0.5) * 5;
    positions[i * 3 + 1] = Math.random() * 2.6 - 0.6;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 3;
  }
  const particleGeo = new THREE.BufferGeometry();
  particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const particles = new THREE.Points(
    particleGeo,
    new THREE.PointsMaterial({ color: 0xa8492f, size: 0.045, transparent: true, opacity: 0.55 })
  );
  scene.add(particles);

  function resize() {
    const w = host.clientWidth;
    const h = host.clientHeight;
    if (!w || !h) return;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }
  resize();
  window.addEventListener('resize', resize);

  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  const start = performance.now();

  function draw(t) {
    petals.forEach((pivot, i) => {
      const k = Math.min(1, Math.max(0, (t - i * 0.07) / 1.4));
      pivot.rotation.x = -1.45 + 0.9 * easeOut(k);
    });
    const kc = Math.min(1, Math.max(0, (t - 0.5) / 1.2));
    core.scale.setScalar(0.4 + 0.6 * easeOut(kc));
    flower.rotation.y = t * 0.12;
    particles.rotation.y = -t * 0.05;
    renderer.render(scene, camera);
  }

  if (reduce) {
    petals.forEach((pivot) => { pivot.rotation.x = -0.55; });
    core.scale.setScalar(1);
    renderer.render(scene, camera);
  } else {
    function frame(now) {
      const t = (now - start) / 1000;
      draw(t);
      if (t < 3) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
</script>
</body>
</html>
