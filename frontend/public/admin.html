<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lượt trả lời</title>
<link rel="stylesheet" href="assets/css/style.css">
<script>window.API_BASE = window.API_BASE || 'https://variety-presents-deck-reverse.trycloudflare.com';</script>
</head>
<body>
<div class="app">
  <header class="topbar"><span class="brand">Inviteflow</span><span class="meta" id="roleMeta">Quản lý</span></header>

  <section class="panel" id="login" style="max-width:480px;margin:48px auto">
    <p class="eyebrow">Riêng tư</p>
    <h1>Kết nối quản lý</h1>
    <svg class="signature" viewBox="0 0 120 8" aria-hidden="true"><path d="M2 6c20-3 48-4 116-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <label class="eyebrow" for="token">Token quản lý</label>
    <input class="field" type="password" id="token" autocomplete="current-password">
    <div class="actions"><button type="button" class="btn btn-primary" id="connect">Kết nối</button></div>
    <p class="status" id="loginStatus" role="status"></p>
  </section>

  <main class="layout" id="shell" hidden>
    <nav class="rail" aria-label="Quản lý">
      <div class="step active"><span class="num">01</span>Tổng quan</div>
      <div class="step"><span class="num">02</span>Lượt trả lời</div>
    </nav>

    <section class="stage">
      <div class="panel">
        <p class="eyebrow">Riêng tư</p>
        <h1>Lượt trả lời</h1>
        <svg class="signature" viewBox="0 0 120 8" aria-hidden="true"><path d="M2 6c20-3 48-4 116-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <div class="actions" style="justify-content:space-between">
          <span class="meta" id="sessionText">Đã kết nối</span>
          <div class="actions" style="margin-top:0">
            <button type="button" class="btn" id="refresh">Làm mới</button>
            <button type="button" class="btn" id="export">Xuất CSV</button>
            <button type="button" class="btn" id="clear">Xóa toàn bộ</button>
          </div>
        </div>

        <div class="stat-grid">
          <div class="stat"><span class="stat-label">Tổng lượt</span><strong class="stat-value" id="statTotal">0</strong></div>
          <div class="stat stat-accent"><span class="stat-label">Đồng ý</span><strong class="stat-value" id="statYes">0</strong></div>
          <div class="stat"><span class="stat-label">Từ chối</span><strong class="stat-value" id="statNo">0</strong></div>
          <div class="stat"><span class="stat-label">Hôm nay</span><strong class="stat-value" id="statToday">0</strong></div>
        </div>

        <section class="chart-block" aria-label="Lượt trả lời theo ngày">
          <div class="chart-head"><span class="stat-label">Lượt theo ngày</span><span class="meta" id="chartRange"></span></div>
          <div class="chart" id="chart"></div>
        </section>

        <div class="filters">
          <input class="field grow" type="search" id="search" placeholder="Tìm món, nước, nơi, người…" aria-label="Tìm kiếm">
          <select class="field" id="consentFilter" aria-label="Lọc câu trả lời">
            <option value="">Tất cả câu trả lời</option>
            <option value="Vâng">Đồng ý</option>
            <option value="Không Nha">Từ chối</option>
          </select>
          <input class="field" type="date" id="dateFilter" aria-label="Lọc từ ngày">
        </div>

        <div class="table-wrap">
          <table>
            <thead><tr><th>Thời gian</th><th>Kết quả</th><th>Ngày hẹn</th><th>Món</th><th>Nước</th><th>Nơi</th><th>Vị trí</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <p class="status" id="empty" hidden>Chưa có lượt trả lời nào</p>
        <p class="status" id="status" role="status"></p>
      </div>
    </section>
  </main>
</div>

<aside class="drawer" id="drawer" hidden aria-label="Chi tiết lượt trả lời">
  <button type="button" class="btn drawer-close" id="drawerClose">Đóng</button>
  <p class="eyebrow">Chi tiết</p>
  <h2 id="drawerTitle">Lượt trả lời</h2>
  <div id="drawerRows"></div>
  <pre id="drawerRaw"></pre>
</aside>

<script type="module">
  import { adminRequest } from './assets/js/api.js';
  import { byId } from './assets/js/app.js';

  const login = byId('login');
  const shell = byId('shell');
  const drawer = byId('drawer');
  const tokenInput = byId('token');
  let all = [];
  let filtered = [];
  let role = 'viewer';

  function showLogin(message) {
    shell.hidden = true;
    drawer.hidden = true;
    login.hidden = false;
    tokenInput.value = '';
    byId('loginStatus').textContent = message || '';
    tokenInput.focus();
  }

  function escapeCsv(value) {
    const text = String(value ?? '');
    return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
  }

  function locationOf(item) {
    return [item.city, item.region, item.country].filter(Boolean).join(', ') || '—';
  }

  function chart() {
    const counts = new Map();
    filtered.forEach((item) => {
      const day = String(item.created_at || '').slice(0, 10);
      if (day) counts.set(day, (counts.get(day) || 0) + 1);
    });
    const days = [...counts.keys()].sort().slice(-14);
    const host = byId('chart');
    host.textContent = '';
    byId('chartRange').textContent = days.length ? `${days[0]} → ${days[days.length - 1]}` : 'Không có dữ liệu';
    const max = Math.max(1, ...days.map((day) => counts.get(day)));
    days.forEach((day) => {
      const count = counts.get(day);
      const column = document.createElement('div');
      column.className = 'chart-day';
      const value = document.createElement('span');
      value.className = 'chart-count';
      value.textContent = count;
      const bar = document.createElement('div');
      bar.className = 'chart-bar';
      bar.style.height = `${Math.max(2, Math.round((count / max) * 64))}px`;
      const label = document.createElement('span');
      label.className = 'chart-label';
      label.textContent = day.slice(5);
      column.append(value, bar, label);
      host.appendChild(column);
    });
  }

  function stats() {
    const today = new Date().toISOString().slice(0, 10);
    byId('statTotal').textContent = all.length;
    byId('statYes').textContent = all.filter((item) => item.consent === 'Vâng').length;
    byId('statNo').textContent = all.filter((item) => item.consent === 'Không Nha').length;
    byId('statToday').textContent = all.filter((item) => String(item.created_at).startsWith(today)).length;
  }

  function applyFilters() {
    const term = byId('search').value.trim().toLowerCase();
    const consent = byId('consentFilter').value;
    const from = byId('dateFilter').value;
    filtered = all.filter((item) => {
      if (consent && item.consent !== consent) return false;
      if (from && String(item.created_at).slice(0, 10) < from) return false;
      if (!term) return true;
      return [item.food, item.drink, item.place, item.free_day, item.visitor_id,
        item.timezone, item.ip, item.country, item.region, item.city]
        .some((value) => String(value || '').toLowerCase().includes(term));
    });
    chart();
    render();
  }

  function time(value) {
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? value : date.toLocaleString('vi-VN');
  }

  function render() {
    const rows = byId('rows');
    rows.textContent = '';
    byId('empty').hidden = filtered.length > 0;
    byId('sessionText').textContent = `Đã kết nối · ${filtered.length} / ${all.length} lượt`;
    byId('status').textContent = '';

    filtered.forEach((item) => {
      const tr = document.createElement('tr');
      const values = [
        time(item.created_at), item.consent, item.free_day || '—',
        item.food || '—', item.drink || '—', item.place || '—',
        locationOf(item)
      ];
      values.forEach((value) => {
        const td = document.createElement('td');
        td.textContent = value;
        tr.appendChild(td);
      });

      const action = document.createElement('td');
      const view = document.createElement('button');
      view.type = 'button';
      view.className = 'btn';
      view.textContent = 'Xem';
      view.addEventListener('click', () => openDetail(item));
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'btn';
      del.textContent = 'Xóa';
      del.addEventListener('click', async () => {
        try {
          await adminRequest(`/api/responses/${encodeURIComponent(item.id)}`, { method: 'DELETE' });
          await load();
        } catch (error) { byId('status').textContent = error.message; }
      });
      if (role === 'admin' || role === 'editor') {
        action.append(view, document.createTextNode(' '), del);
      } else {
        action.appendChild(view);
      }
      tr.appendChild(action);
      rows.appendChild(tr);
    });
  }

  function openDetail(item) {
    byId('drawerTitle').textContent = time(item.created_at);
    const container = byId('drawerRows');
    container.textContent = '';
    const fields = [
      ['Mã lượt', item.id], ['Câu trả lời', item.consent], ['Ngày hẹn', item.free_day],
      ['Món', item.food], ['Nước', item.drink], ['Nơi', item.place],
      ['Mã người', item.visitor_id], ['Ngôn ngữ', item.language],
      ['Múi giờ', item.timezone], ['IP', item.ip],
      ['Quốc gia', item.country], ['Khu vực', item.region], ['Thành phố', item.city],
      ['Thiết bị', item.user_agent]
    ];
    fields.forEach(([label, value]) => {
      const row = document.createElement('div');
      row.className = 'drawer-row';
      const left = document.createElement('span');
      left.textContent = label;
      const right = document.createElement('span');
      right.textContent = value || '—';
      row.append(left, right);
      container.appendChild(row);
    });
    byId('drawerRaw').textContent = JSON.stringify(item, null, 2);
    drawer.hidden = false;
  }

  function exportCsv() {
    const header = ['id', 'created_at', 'consent', 'free_day', 'food', 'drink', 'place', 'visitor_id', 'language', 'timezone', 'ip', 'country', 'region', 'city', 'user_agent'];
    const lines = [header.join(',')];
    filtered.forEach((item) => lines.push(header.map((key) => escapeCsv(item[key])).join(',')));
    const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'inviteflow-responses.csv';
    link.click();
    URL.revokeObjectURL(link.href);
  }

  async function load() {
    if (!sessionStorage.getItem('adminToken')) { showLogin(); return; }
    login.hidden = true;
    shell.hidden = false;
    try {
      const profile = await adminRequest('/api/me');
      role = profile.role;
      byId('roleMeta').textContent = `Quản lý · ${profile.label}`;
      byId('clear').hidden = role !== 'admin';
      all = await adminRequest('/api/responses');
      stats();
      applyFilters();
    } catch (error) { showLogin(error.message); }
  }

  async function connect() {
    const token = tokenInput.value.trim();
    if (!token) { byId('loginStatus').textContent = 'Nhập token để tiếp tục'; return; }
    sessionStorage.setItem('adminToken', token);
    await load();
  }

  byId('connect').addEventListener('click', connect);
  tokenInput.addEventListener('keydown', (event) => { if (event.key === 'Enter') connect(); });
  byId('refresh').addEventListener('click', load);
  byId('export').addEventListener('click', exportCsv);
  byId('search').addEventListener('input', applyFilters);
  byId('consentFilter').addEventListener('change', applyFilters);
  byId('dateFilter').addEventListener('change', applyFilters);
  byId('drawerClose').addEventListener('click', () => { drawer.hidden = true; });
  byId('clear').addEventListener('click', async () => {
    if (!confirm('Xóa toàn bộ lượt trả lời?')) return;
    try {
      await adminRequest('/api/responses', { method: 'DELETE' });
      await load();
    } catch (error) { byId('status').textContent = error.message; }
  });

  load();
</script>
</body>
</html>
