<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chọn món ăn</title>
<meta name="description" content="Chọn món ăn cho buổi hẹn.">
<meta property="og:title" content="Một lời mời">
<meta property="og:image" content="https://motloimoi.cc.cd/og-image.svg">
<link rel="canonical" href="https://motloimoi.cc.cd/food.html">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="stylesheet" href="assets/css/style.css">
<script>window.API_BASE = window.API_BASE || 'https://inviteflow-api2.onrender.com';</script>
</head>
<body>
<div class="app">
  <header class="topbar"><span class="brand"><img src="assets/img/logo-micro.png" width="28" height="28" alt="">Inviteflow</span><span class="meta">Bước 2 / 4</span></header>
  <div class="layout">
    <nav class="rail" aria-label="Các bước">
      <div class="step done"><span class="num">01</span>Ngày</div>
      <div class="step active"><span class="num">02</span>Món</div>
      <div class="step"><span class="num">03</span>Nước</div>
      <div class="step"><span class="num">04</span>Nơi</div>
    </nav>
    <main class="stage">
      <section class="panel">
        <p class="eyebrow">Món ăn</p>
        <h1 id="foodTitle">Em muốn ăn món gì?</h1>
        <svg class="signature" viewBox="0 0 120 8" aria-hidden="true"><path d="M2 6c20-3 48-4 116-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <div class="choice-grid" id="choices"></div>
        <p class="status" id="status"></p>
        <div class="actions" id="nextWrap" hidden><button type="button" class="btn btn-primary" id="next">Tiếp</button></div>
      </section>
    </main>
  </div>
</div>
<script type="module">
  import { renderChoices, reveal, setStatus, go, toast, loadContent } from './assets/js/app.js';

  function render(page) {
    if (page.title) document.getElementById('foodTitle').textContent = page.title;
    const items = Array.isArray(page.items) && page.items.length ? page.items : [];
    renderChoices(items, 'choices', 'food', (item) => {
      const message = item.message || `Một ${item.name} sẽ được phục vụ`;
      setStatus('status', message);
      toast(message);
      reveal('nextWrap');
    });
  }

  loadContent().then((content) => render(content.food || {}));
  document.getElementById('next').addEventListener('click', () => go('drink.html'));
</script>
</body>
</html>
