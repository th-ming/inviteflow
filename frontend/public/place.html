<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chọn nơi đi chơi</title>
<meta name="description" content="Chọn nơi đi chơi cho buổi hẹn.">
<meta property="og:title" content="Một lời mời">
<meta property="og:image" content="https://motloimoi.cc.cd/og-image.svg">
<link rel="canonical" href="https://motloimoi.cc.cd/place.html">
<link rel="stylesheet" href="assets/css/style.css">
<script>window.API_BASE = window.API_BASE || 'https://mood-moderator-competition-asia.trycloudflare.com';</script>
</head>
<body>
<div class="app">
  <header class="topbar"><span class="brand">Inviteflow</span><span class="meta">Bước 4 / 4</span></header>
  <div class="layout">
    <nav class="rail" aria-label="Các bước">
      <div class="step done"><span class="num">01</span>Ngày</div>
      <div class="step done"><span class="num">02</span>Món</div>
      <div class="step done"><span class="num">03</span>Nước</div>
      <div class="step active"><span class="num">04</span>Nơi</div>
    </nav>
    <main class="stage">
      <section class="panel">
        <p class="eyebrow">Địa điểm</p>
        <h1>Xong em muốn đi chơi đâu nữa nà?</h1>
        <svg class="signature" viewBox="0 0 120 8" aria-hidden="true"><path d="M2 6c20-3 48-4 116-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <div class="choice-grid" id="choices"></div>
        <p class="status" id="status"></p>
        <div class="actions" id="nextWrap" hidden><button type="button" class="btn btn-primary" id="next">Tiếp</button></div>
      </section>
    </main>
  </div>
</div>
<script type="module">
  import { renderChoices, reveal, setStatus, go, toast } from './assets/js/app.js';
  const special = 'Nơi Có Chúng Ta';
  renderChoices([
    { name: 'Công Viên', image: 'https://i.pinimg.com/736x/c9/64/58/c9645891fc4c84d400a93c00c8dc42a2.jpg' },
    { name: 'Rạp Phim', image: 'https://i.pinimg.com/736x/1f/5e/cc/1f5ecca4b80819393a320a95d14c51d0.jpg' },
    { name: 'Quán Cafe', image: 'https://i.pinimg.com/736x/c7/b8/fc/c7b8fcfc09f0c709458ba1e657405c15.jpg' },
    { name: 'Nhà Ma', image: 'https://dulich9.com/wp-content/uploads/2024/01/Dia-chi-cac-nha-ma-o-Ha-Noi-03.webp' },
    { name: 'Dạo Quanh VNUA', image: 'https://www.vnua.edu.vn/DATA/0/IMAGES/2017/07/hocvien/2017-2707hocvien004.JPG' },
    { name: special, image: 'https://i.pinimg.com/736x/b6/08/3c/b6083cc8a66ab145ec71efce64ad96b2.jpg' }
  ], 'choices', 'place', (label) => {
    setStatus('status', label === special
      ? 'Đi đâu miễn đi cùng em là được 🥰'
      : `Một buổi đi chơi ${label} thật tuyệt vời nhé`);
    toast(label === special
      ? 'Đi Đâu Miễn Đi Cùng Em Là Được 🥰'
      : `Một buổi đi chơi ${label} thật tuyệt vời nhé!`);
    reveal('nextWrap');
  });
  document.getElementById('next').addEventListener('click', () => go('done.html'));
</script>
</body>
</html>
