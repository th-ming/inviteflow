<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chọn ngày hẹn</title>
<meta name="description" content="Chọn một ngày để cả hai cùng rảnh.">
<meta property="og:title" content="Một lời mời">
<meta property="og:image" content="https://motloimoi.cc.cd/og-image.svg">
<link rel="canonical" href="https://motloimoi.cc.cd/date.html">
<link rel="stylesheet" href="assets/css/style.css">
<script>window.API_BASE = window.API_BASE || 'https://inviteflow-api2.onrender.com';</script>
</head>
<body>
<div class="app">
  <header class="topbar"><span class="brand">Inviteflow</span><span class="meta">Bước 1 / 4</span></header>
  <div class="layout">
    <nav class="rail" aria-label="Các bước">
      <div class="step active"><span class="num">01</span>Ngày</div>
      <div class="step"><span class="num">02</span>Món</div>
      <div class="step"><span class="num">03</span>Nước</div>
      <div class="step"><span class="num">04</span>Nơi</div>
    </nav>
    <main class="stage">
      <section class="panel">
        <p class="eyebrow">Ngày rảnh</p>
        <h1>Em rảnh vào hàm nè</h1>
        <svg class="signature" viewBox="0 0 120 8" aria-hidden="true"><path d="M2 6c20-3 48-4 116-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <p class="lead">Chọn một ngày để cả hai cùng rảnh.</p>
        <label class="eyebrow" for="datepicker">Ngày</label>
        <input class="field" type="date" id="datepicker" style="max-width:280px">
        <div class="actions">
          <button type="button" class="btn btn-primary" id="pick">Chọn</button>
          <button type="button" class="btn" id="cancel">Hủy</button>
        </div>
        <p class="status" id="status"></p>
        <div class="actions" id="nextWrap" hidden><button type="button" class="btn" id="next">Tiếp</button></div>
      </section>
    </main>
  </div>
</div>
<script type="module">
  import { save, go, formatDay, reveal, setStatus, toast } from './assets/js/app.js';
  const input = document.getElementById('datepicker');
  document.getElementById('pick').addEventListener('click', () => {
    if (!input.value) {
      setStatus('status', 'Vui lòng chọn ngày');
      document.getElementById('nextWrap').hidden = true;
      return;
    }
    save('freeDay', input.value);
    setStatus('status', `Bạn chọn ngày: ${formatDay(input.value)}`);
    setTimeout(() => toast('Một buổi hẹn tuyệt vời sẽ đến!'), 500);
    reveal('nextWrap');
  });
  document.getElementById('cancel').addEventListener('click', () => {
    input.value = '';
    setStatus('status', 'Đã hủy chọn ngày');
    document.getElementById('nextWrap').hidden = true;
  });
  document.getElementById('next').addEventListener('click', () => go('food.html'));
</script>
</body>
</html>
