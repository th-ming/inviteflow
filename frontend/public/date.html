<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chọn ngày hẹn</title>
<meta name="description" content="Chọn một ngày để cả hai cùng rảnh.">
<meta property="og:title" content="Một lời mời">
<meta property="og:description" content="Chọn một ngày để cả hai cùng rảnh.">
<meta property="og:image" content="https://motloimoi.cc.cd/og-image.svg">
<link rel="canonical" href="https://motloimoi.cc.cd/date.html">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="stylesheet" href="assets/css/style.css">
<script>window.API_BASE = window.API_BASE || 'https://inviteflow-api2.onrender.com';</script>
</head>
<body>
<div class="app">
  <header class="topbar"><span class="brand"><img src="assets/img/logo-micro.png" width="28" height="28" alt="">Inviteflow</span><span class="meta">Bước 1 / 4</span></header>
  <div class="layout">
    <nav class="rail" aria-label="Các bước">
      <div class="step active"><span class="num">01</span>Ngày</div>
      <div class="step"><span class="num">02</span>Món</div>
      <div class="step"><span class="num">03</span>Nước</div>
      <div class="step"><span class="num">04</span>Nơi</div>
    </nav>
    <main class="stage">
      <section class="panel">
        <p class="eyebrow">Ngày rảnh</p>
        <h1 id="dateTitle">Em rảnh vào hàm nè</h1>
        <svg class="signature" viewBox="0 0 120 8" aria-hidden="true"><path d="M2 6c20-3 48-4 116-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <p class="lead" id="dateLead">Chọn một ngày để cả hai cùng rảnh.</p>
        <label class="eyebrow" for="datepicker">Ngày</label>
        <input class="field" type="date" id="datepicker" style="max-width:280px">
        <div class="actions">
          <button type="button" class="btn btn-primary" id="pick">Chọn</button>
          <button type="button" class="btn" id="cancel">Hủy</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <div class="actions" id="nextWrap" hidden><button type="button" class="btn btn-primary" id="next">Tiếp</button></div>
      </section>
    </main>
  </div>
</div>
<script type="module">
  import { save, read, go, formatDay, reveal, setStatus, toast, loadContent } from './assets/js/app.js';
  const input = document.getElementById('datepicker');
  const nextWrap = document.getElementById('nextWrap');
  const now = new Date();
  input.min = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  const saved = read('freeDay');
  if (saved) {
    input.value = saved;
    setStatus('status', `Bạn chọn ngày: ${formatDay(saved)}`);
    nextWrap.hidden = false;
  }
  document.getElementById('pick').addEventListener('click', () => {
    if (!input.value) {
      setStatus('status', 'Vui lòng chọn ngày');
      nextWrap.hidden = true;
      return;
    }
    save('freeDay', input.value);
    setStatus('status', `Bạn chọn ngày: ${formatDay(input.value)}`);
    toast('Một buổi hẹn tuyệt vời sẽ đến!');
    reveal('nextWrap');
  });
  document.getElementById('cancel').addEventListener('click', () => {
    input.value = '';
    nextWrap.hidden = true;
    localStorage.removeItem('freeDay');
    setStatus('status', 'Đã hủy chọn ngày');
  });
  document.getElementById('next').addEventListener('click', () => go('food.html'));

  loadContent().then((content) => {
    const page = content.date || {};
    if (page.title) document.getElementById('dateTitle').textContent = page.title;
    if (page.lead) document.getElementById('dateLead').textContent = page.lead;
  });
</script>
</body>
</html>
